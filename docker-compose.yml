services:
  # PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    volumes:
      - pg-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=gpurent
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "54322:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gpurent"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # Stripe mock service to simulate payments
  stripe-mock:
    image: stripe/stripe-mock:latest
    ports:
      - "12111:12111"
    restart: always

  # Mailpit SMTP Mail Capture service
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"  # SMTP port
      - "8025:8025"  # Web UI port
    restart: always

  # Django Web API service
  web:
    build: .
    command: sh -c "uv run python manage.py migrate && uv run python manage.py seed_catalog && uv run python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - MOCK_PAYMENT_BASE_URL=http://stripe-mock:12111
      - DB_HOST=db
      - DB_PORT=5432
      - POSTGRES_DB=gpurent
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - EMAIL_HOST=mailpit
      - EMAIL_PORT=1025
    depends_on:
      db:
        condition: service_healthy
    restart: always

  # Simulation worker service (runs the background metrics simulation loop)
  # worker:
  #   build: .
  #   command: uv run python manage.py run_simulation --interval 5.0
  #   volumes:
  #     - .:/app
  #   environment:
  #     - DEBUG=True
  #     - MOCK_PAYMENT_BASE_URL=http://stripe-mock:12111
  #     - DB_HOST=db
  #     - DB_PORT=5432
  #     - POSTGRES_DB=gpurent
  #     - POSTGRES_USER=postgres
  #     - POSTGRES_PASSWORD=postgres
  #     - EMAIL_HOST=mailpit
  #     - EMAIL_PORT=1025
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #     stripe-mock:
  #       condition: service_started
  #     mailpit:
  #       condition: service_started
  #   restart: always

  # Background Queue Worker (runs the steady_queue task processor)
  queue-worker:
    build: .
    command: sh -c "uv run python manage.py migrate && uv run python manage.py steady_queue"
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - DB_HOST=db
      - DB_PORT=5432
      - POSTGRES_DB=gpurent
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - EMAIL_HOST=mailpit
      - EMAIL_PORT=1025
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  pg-data:
